#agenda-app * { box-sizing: border-box; margin: 0; padding: 0; }
#agenda-app {
  --bg: #12151a;
  --bg-elev: #1b1f27;
  --bg-elev-2: #232833;
  --border: #2a3038;
  --text: #f2f1ec;
  --text-muted: #8c94a3;
  --muaythai: #ff4463;
  --corrida: #4a90ff;
  --combo: #1ecab8;
  --descanso: #565e6b;
  --viagem: #a978ff;
  --gold: #f3c23d;
  --radius: 16px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 48px;
  -webkit-font-smoothing: antialiased;
}
#agenda-app .disp { font-family: 'Archivo Narrow', Arial, sans-serif; }
#agenda-app .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

/* ---------- HERO ---------- */
#agenda-app .hero {
  background: linear-gradient(180deg, #171b22 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  padding: 20px 0 18px;
}
#agenda-app .eyebrow {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
#agenda-app .eyebrow .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--corrida);
  box-shadow: 0 0 0 3px rgba(74,144,255,0.18);
}
#agenda-app .hero-main {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 10px;
}
#agenda-app .hero-number {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: clamp(56px, 20vw, 76px);
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  background: linear-gradient(180deg, #ffffff 0%, #c9cedb 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
#agenda-app .hero-label {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.3;
  max-width: 130px;
  font-weight: 500;
}
#agenda-app .hero-sub {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-muted);
}
#agenda-app .hero-sub b { color: var(--gold); font-weight: 700; }

/* ---------- TRACK (progress) ---------- */
#agenda-app .track-section { padding: 18px 0 4px; }
#agenda-app .track-title {
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 700; margin-bottom: 10px;
}
#agenda-app .track {
  display: flex; gap: 3px; height: 34px;
  border-radius: 10px; overflow: hidden;
  background: var(--bg-elev);
  padding: 3px;
}
#agenda-app .lane {
  flex: 1; position: relative; border-radius: 6px;
  background: var(--bg-elev-2);
  overflow: hidden;
  cursor: pointer;
  border: 1px solid transparent;
  transition: border-color 0.15s;
}
#agenda-app .lane.active { border-color: var(--corrida); }
#agenda-app .lane-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--corrida);
  transition: width 0.4s ease;
}
#agenda-app .lane.has-milestone .lane-fill { background: var(--gold); }
#agenda-app .lane-num {
  position: relative; z-index: 1;
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700; font-size: 13px; color: var(--text);
}

/* ---------- SPEED CHIPS ---------- */
#agenda-app .chips-row {
  display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px;
  scrollbar-width: none;
}
#agenda-app .chips-row::-webkit-scrollbar { display: none; }
#agenda-app .chip {
  flex: 0 0 auto;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 11px;
  font-size: 12px;
  white-space: nowrap;
  color: var(--text-muted);
}
#agenda-app .chip b { color: var(--text); font-weight: 700; }

/* ---------- STATS ---------- */
#agenda-app .stats-row {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
  padding: 16px 0 4px;
}
#agenda-app .stat {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
}
#agenda-app .stat-emoji { font-size: 16px; }
#agenda-app .stat-num {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700; font-size: 20px; margin-top: 2px;
}
#agenda-app .stat-label {
  font-size: 10px; color: var(--text-muted); margin-top: 1px;
  letter-spacing: 0.02em;
}

/* ---------- WEEK TABS ---------- */
#agenda-app .tabs-section { padding: 18px 0 0; }
#agenda-app .tabs {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
#agenda-app .tabs::-webkit-scrollbar { display: none; }
#agenda-app .tab {
  flex: 0 0 auto;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 13px;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
  line-height: 1.15;
}
#agenda-app .tab .tab-range { display: block; font-family: 'Inter'; font-weight: 500; font-size: 9px; margin-top: 1px; letter-spacing: 0.02em; }
#agenda-app .tab.active {
  background: var(--corrida);
  border-color: var(--corrida);
  color: #fff;
}

/* ---------- WEEK HEADER ---------- */
#agenda-app .week-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 12px;
}
#agenda-app .week-header h2 {
  font-family: 'Archivo Narrow', sans-serif;
  font-size: 20px; font-weight: 700;
}
#agenda-app .week-header .range { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
#agenda-app .week-progress-pill {
  font-size: 11px; font-weight: 700; color: var(--text);
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 10px;
  font-variant-numeric: tabular-nums;
}

/* ---------- CARDS ---------- */
#agenda-app .cards { display: flex; flex-direction: column; gap: 10px; }
#agenda-app .card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 3px solid var(--type-color, var(--border));
  border-radius: var(--radius);
  padding: 13px 14px;
  position: relative;
}
#agenda-app .card.today { box-shadow: 0 0 0 1.5px var(--gold); }
#agenda-app .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
#agenda-app .card-date {
  display: flex; flex-direction: column; align-items: center;
  flex: 0 0 auto; width: 40px;
}
#agenda-app .card-date .dd {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700; font-size: 20px; line-height: 1;
}
#agenda-app .card-date .dow {
  font-size: 10px; text-transform: uppercase; color: var(--text-muted);
  letter-spacing: 0.05em; margin-top: 2px;
}
#agenda-app .card-body { flex: 1; min-width: 0; }
#agenda-app .card-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#agenda-app .card-title { font-weight: 700; font-size: 14.5px; }
#agenda-app .today-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 0.06em;
  background: var(--gold); color: #1a1500;
  padding: 2px 6px; border-radius: 5px;
}
#agenda-app .card-time { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
#agenda-app .card-details {
  margin-top: 7px; padding-left: 16px; display: flex; flex-direction: column; gap: 3px;
}
#agenda-app .card-details li { font-size: 12.5px; color: var(--text); opacity: 0.9; }
#agenda-app .card-note {
  margin-top: 7px; font-size: 11.5px; color: var(--text-muted); font-style: italic;
}
#agenda-app .status-row { display: flex; gap: 6px; margin-top: 11px; }
#agenda-app .status-btn {
  flex: 1; border: 1px solid var(--border); background: var(--bg-elev-2);
  border-radius: 9px; padding: 7px 0; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
#agenda-app .status-btn:active { transform: scale(0.94); }
#agenda-app .status-btn.on { border-color: var(--sb-color); background: color-mix(in srgb, var(--sb-color) 18%, var(--bg-elev-2)); }

/* off day card (descanso/viagem) */
#agenda-app .card.simple { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
#agenda-app .card.simple .card-date { width: 40px; }
#agenda-app .card.simple .simple-label { font-weight: 700; font-size: 13.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }

/* ---------- LEGEND ---------- */
#agenda-app .legend {
  margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border);

#agenda-app .legend-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 9px; }
#agenda-app .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
#agenda-app .legend-item { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
#agenda-app .reset-link {
  margin-top: 18px; font-size: 11.5px; color: var(--text-muted); text-decoration: underline;
  cursor: pointer; text-align: center;
}
#agenda-app .loading { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>

  const todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth()+1).padStart(2,'0') + '-' + String(todayObj.getDate()).padStart(2,'0');

  const OBJETIVO_DATE = toDateOnly('2026-10-10');
  const TESTE_DATE = toDateOnly('2026-09-26');

  let statuses = {};
  let activeWeek = 1;
  for (const wk of WEEKS) {
    if (todayStr >= wk.start && todayStr <= wk.end) activeWeek = wk.w;
  }
  if (todayStr < WEEKS[0].start) activeWeek = 1;
  if (todayStr > WEEKS[WEEKS.length-1].end) activeWeek = 8;

  const $ = sel => document.querySelector(sel);

  function renderHero() {
    const diff = Math.round((OBJETIVO_DATE - todayObj) / 86400000);
    let num, label;
    if (diff > 0) { num = diff; label = 'dias até correr 5 km sem caminhar 🎯'; }
    else if (diff === 0) { num = 'HOJE'; label = 'é o dia do objetivo final 🎯'; }
    else { num = '—'; label = 'período do plano encerrado'; }
    $('#hero-number').textContent = num;
    $('#hero-label').textContent = label;

    const diffTeste = Math.round((TESTE_DATE - todayObj) / 86400000);
    let subTxt = '';
    if (diffTeste > 0) subTxt = 'Teste principal (🏁 5 km) em <b>' + diffTeste + ' dias</b>, dia 26/09.';
    else if (diffTeste === 0) subTxt = '<b>Hoje é o teste principal</b> — 5 km sem caminhar 🏁';
    else subTxt = 'Teste principal já realizado — objetivo final em 10/10.';
    $('#hero-sub').innerHTML = subTxt;
  }

  function weekStats(wk) {
    const relevant = wk.days.filter(d => !OFF_TYPES.has(d.type));
    const logged = relevant.filter(d => statuses[d.d]);
    return {total: relevant.length, logged: logged.length};
  }

  function renderTrack() {
    const track = $('#track');
    track.innerHTML = '';
    WEEKS.forEach(wk => {
      const {total, logged} = weekStats(wk);
      const pct = total ? Math.round((logged/total)*100) : 0;
      const hasMilestone = wk.days.some(d => d.type === 'teste' || d.type === 'objetivo');
      const lane = document.createElement('div');
      lane.className = 'lane' + (wk.w === activeWeek ? ' active' : '') + (hasMilestone ? ' has-milestone' : '');
      lane.innerHTML = '<div class="lane-fill" style="width:' + pct + '%"></div><div class="lane-num">' + wk.w + '</div>';
      lane.addEventListener('click', () => { activeWeek = wk.w; renderAll(); scrollTabIntoView(); });
      track.appendChild(lane);
    });
  }

  function renderChips() {
    const chips = $('#chips');
    if (chips.childElementCount) return;
    const data = [
      ['🚶','Caminhada','5,5 km/h'],
      ['🏃','Corrida leve','6,5 km/h'],
      ['🏃','Corrida moderada','6,8 km/h'],
      ['🏃','Corrida contínua','7,0 km/h'],
    ];
    chips.innerHTML = data.map(([icon,label,val]) =>
      '<div class="chip">' + icon + ' ' + label + ' · <b>' + val + '</b></div>'
    ).join('');
  }

  function renderStats() {
    const counts = {green:0, yellow:0, red:0, star:0};
    actionableDays.forEach(d => { const s = statuses[d.d]; if (s && counts[s] !== undefined) counts[s]++; });
    const stats = $('#stats');
    stats.innerHTML = [
      ['🟢','concluídos', counts.green],
      ['🟡','caminhei', counts.yellow],
      ['🔴','não rolou', counts.red],
      ['⭐','recordes', counts.star],
    ].map(([e,l,n]) =>
      '<div class="stat"><div class="stat-emoji">'+e+'</div><div class="stat-num disp">'+n+'</div><div class="stat-label">'+l+'</div></div>'
    ).join('');
  }

  function scrollTabIntoView() {
    const el = document.querySelector('.tab[data-week="'+activeWeek+'"]');
    if (el) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function renderTabs() {
    const tabs = $('#tabs');
    tabs.innerHTML = WEEKS.map(wk =>
      '<div class="tab' + (wk.w===activeWeek ? ' active':'') + '" data-week="'+wk.w+'">S'+wk.w+
      '<span class="tab-range">'+fmtRange(wk.start, wk.end)+'</span></div>'
    ).join('');
    tabs.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', () => {
        activeWeek = parseInt(el.getAttribute('data-week'));
        renderAll();
      });
    });
  }

  function statusButtonsHtml(dateStr) {
    return '<div class="status-row">' + STATUS_ORDER.map(key => {
      const meta = STATUS_META[key];
      const on = statuses[dateStr] === key;
      return '<div class="status-btn'+(on?' on':'')+'" style="--sb-color:'+meta.color+'" data-date="'+dateStr+'" data-status="'+key+'">'+meta.emoji+'</div>';
    }).join('') + '</div>';
  }

  function renderCard(day) {
    const meta = TYPE_META[day.type];
    const isToday = day.d === todayStr;
    if (OFF_TYPES.has(day.type)) {
      return '<div class="card simple" style="--type-color:'+meta.color+'">' +
        '<div class="card-date"><div class="dd disp">'+fmtDD(day.d)+'</div><div class="dow">'+day.dow+'</div></div>' +
        '<div class="simple-label">'+meta.icon+' '+day.title+(isToday?' <span class="today-badge">HOJE</span>':'')+'</div>' +
      '</div>';
    }
    const details = (day.details||[]).map(li => '<li>'+li+'</li>').join('');
    return '<div class="card'+(isToday?' today':'')+'" style="--type-color:'+meta.color+'">' +
      '<div class="card-top">' +
        '<div class="card-date"><div class="dd disp">'+fmtDD(day.d)+'</div><div class="dow">'+day.dow+'</div></div>' +
        '<div class="card-body">' +
          '<div class="card-title-row"><span class="card-title">'+meta.icon+' '+day.title+'</span>' + (isToday?'<span class="today-badge">HOJE</span>':'') + '</div>' +
          (day.time ? '<div class="card-time">'+day.time+'</div>' : '') +
          (details ? '<ul class="card-details">'+details+'</ul>' : '') +
          (day.note ? '<div class="card-note">'+day.note+'</div>' : '') +
          statusButtonsHtml(day.d) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderWeek() {
    const wk = WEEKS.find(w => w.w === activeWeek);
    $('#week-title').textContent = 'Semana ' + wk.w;
    $('#week-range').textContent = fmtRange(wk.start, wk.end);
    const {total, logged} = weekStats(wk);
    $('#week-pill').textContent = logged + '/' + total;
    $('#cards').innerHTML = wk.days.map(renderCard).join('');

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const date = btn.getAttribute('data-date');
        const status = btn.getAttribute('data-status');
        if (statuses[date] === status) delete statuses[date];
        else statuses[date] = status;
        renderAll();
        await saveStatuses();
      });
    });
  }

  function renderAll() {
    renderHero();
    renderTrack();
    renderChips();
    renderStats();
    renderTabs();
    renderWeek();
  }

  async function loadStatuses() {
    try {
      const saved = localStorage.getItem('statuses');
      statuses = saved ? JSON.parse(saved) : {};
    } catch (e) {
      statuses = {};
    }
    renderAll();
    requestAnimationFrame(scrollTabIntoView);
  }

  async function saveStatuses() {
    try {
      localStorage.setItem('statuses', JSON.stringify(statuses));
    } catch (e) {
      console.error('Erro ao salvar progresso:', e);
    }
  }

  $('#reset-link').addEventListener('click', async () => {
    if (!confirm('Apagar todo o progresso registrado nesta agenda? Essa ação não pode ser desfeita.')) return;
    statuses = {};
    renderAll();
    await saveStatuses();
  });

  loadStatuses();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.error('Erro ao registrar service worker:', err);
    });
  });
}
</script>
</body>
</html>
